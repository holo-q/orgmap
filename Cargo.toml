[package]
name = "orgmap"
version = "0.1.0"
edition = "2021"
authors = ["nuck"]
description = "Organization/workgroup marker protocol and shell utility"
license = "MIT"
repository = "https://github.com/holo-q/orgmap"
readme = "README.md"

[[bin]]
name = "org"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
